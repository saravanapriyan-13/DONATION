<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ShareSphere</title>
  <meta name="description" content="Sign in to your ShareSphere community account to donate, request resources, and chat with neighbors.">
  
  <!-- CSS Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom ShareSphere Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: radial-gradient(circle at 10% 20%, rgba(209, 250, 229, 0.45) 0%, rgba(248, 250, 252, 0.9) 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Global Navigation Bar -->
  <nav class="navbar navbar-expand-lg sharesphere-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="bi bi-arrow-repeat"></i></div>
        <span class="brand-name">ShareSphere</span>
        <span class="brand-tag">Free Sharing</span>
      </a>

      <div class="ms-auto">
        <a href="register.html" class="btn btn-sm btn-outline-primary-custom">
          Join Community
        </a>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width: 480px;">
      
      <div class="card border-0 shadow-xl rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-2" style="width: 52px; height: 52px; font-size: 1.5rem;">
            <i class="bi bi-arrow-repeat"></i>
          </div>
          <h3 class="fw-bold text-dark font-display mb-1">Welcome Back</h3>
          <p class="small text-muted mb-0">Sign in to share and request neighborhood resources.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Email Address</label>
            <input type="email" id="login-email" class="form-control rounded-3" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Password</label>
            <input type="password" id="login-password" class="form-control rounded-3" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3" id="btn-login-submit">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </form>

        <div class="text-center small text-muted">
          Don't have an account yet? 
          <a href="register.html" class="fw-bold text-primary text-decoration-none">Create free account</a>
        </div>
      </div>

    </div>
  </main>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ShareSphere Core Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/location.js"></script>

  <script>
    async function executeLogin(email, password) {
      const btn = document.getElementById('btn-login-submit');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
      }

      const res = await window.ShareSphereAuth.login(email, password);
      if (res.success) {
        window.ShareSphereUtils.showToast(`Welcome back, ${res.user.name}!`, 'success');
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || (res.user.role === 'admin' ? 'admin.html' : 'explore.html');
        setTimeout(() => window.location.href = redirect, 600);
      } else {
        window.ShareSphereUtils.showToast(res.error || 'Authentication failed. Please check credentials.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
        }
      }
    }

    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      executeLogin(email, pass);
    });
  </script>
</body>
</html>
