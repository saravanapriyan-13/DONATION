<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account - ShareSphere</title>
  <meta name="description" content="Join ShareSphere today. Share unused resources and help your local community thrive sustainably.">
  
  <!-- CSS Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom ShareSphere Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: radial-gradient(circle at 10% 20%, rgba(209, 250, 229, 0.45) 0%, rgba(248, 250, 252, 0.9) 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Global Navigation Bar -->
  <nav class="navbar navbar-expand-lg sharesphere-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="bi bi-arrow-repeat"></i></div>
        <span class="brand-name">ShareSphere</span>
        <span class="brand-tag">Free Sharing</span>
      </a>

      <div class="ms-auto">
        <a href="login.html" class="btn btn-sm btn-outline-secondary">
          Sign In
        </a>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width: 520px;">
      
      <div class="card border-0 shadow-xl rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-2" style="width: 52px; height: 52px; font-size: 1.5rem;">
            <i class="bi bi-people-fill"></i>
          </div>
          <h3 class="fw-bold text-dark font-display mb-1">Join ShareSphere</h3>
          <p class="small text-muted mb-0">Free community platform for giving, finding, and reducing waste.</p>
        </div>

        <form id="register-form">
          <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Full Name *</label>
            <input type="text" id="reg-name" class="form-control rounded-3" placeholder="e.g. Maya Sharma" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Email Address *</label>
            <input type="email" id="reg-email" class="form-control rounded-3" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Password *</label>
            <input type="password" id="reg-password" class="form-control rounded-3" placeholder="••••••••" minlength="6" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small text-dark">Your City / Neighborhood Landmark *</label>
            <input type="text" id="reg-location" class="form-control rounded-3" placeholder="e.g. Indiranagar, Bangalore" required value="Indiranagar, Bangalore">
            <small class="text-muted" style="font-size: 0.72rem;">Used solely for the 10 km resource radius calculations.</small>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3" id="btn-reg-submit">
            <i class="bi bi-check2-circle"></i> Create Free Account
          </button>
        </form>

        <div class="text-center small text-muted">
          Already registered? 
          <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign in here</a>
        </div>
      </div>

    </div>
  </main>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- ShareSphere Core Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/location.js"></script>

  <script>
    document.getElementById('register-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value.trim();
      const loc = document.getElementById('reg-location').value.trim();

      const btn = document.getElementById('btn-reg-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating account...';

      const res = await window.ShareSphereAuth.register(name, email, pass, loc);
      if (res.success) {
        window.ShareSphereUtils.showToast(`Welcome to ShareSphere, ${res.user.name}! 🌱`, 'success');
        setTimeout(() => window.location.href = 'explore.html', 800);
      } else {
        window.ShareSphereUtils.showToast(res.error || 'Could not create your account. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle"></i> Create Free Account';
      }
    });
  </script>
</body>
</html>
