<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - ShareSphere Community</title>
  <meta name="description" content="Stay updated with resource requests, approvals, pickup coordination, and nearby community alerts.">
  
  <!-- CSS Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom ShareSphere Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Global Navigation Bar -->
  <nav class="navbar navbar-expand-lg sharesphere-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="bi bi-arrow-repeat"></i></div>
        <span class="brand-name">ShareSphere</span>
        <span class="brand-tag">Free Sharing</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="explore.html"><i class="bi bi-compass"></i> Explore</a></li>
          <li class="nav-item"><a class="nav-link" href="donate.html"><i class="bi bi-plus-circle"></i> Donate</a></li>
          <li class="nav-item"><a class="nav-link" href="requests.html"><i class="bi bi-arrow-left-right"></i> My Requests</a></li>
          <li class="nav-item"><a class="nav-link" href="donations.html"><i class="bi bi-box2-heart"></i> My Donations</a></li>
          <li class="nav-item"><a class="nav-link" href="impact.html"><i class="bi bi-globe-americas"></i> Impact</a></li>
        </ul>

        <div id="navbar-auth-section" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container" style="max-width: 800px;">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <span class="section-tag"><i class="bi bi-bell-fill"></i> Activity Feed</span>
          <h2 class="section-title mb-1">Notifications</h2>
          <p class="text-muted mb-0">Live alerts for your community resource sharing activities.</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary rounded-pill" id="btn-mark-all-read">
          <i class="bi bi-check2-all"></i> Mark All as Read
        </button>
      </div>

      <!-- Filters -->
      <div class="btn-group mb-4 shadow-sm rounded-pill overflow-hidden" role="group">
        <button type="button" class="btn btn-sm btn-outline-secondary active px-3" data-notif-filter="all">All Alerts</button>
        <button type="button" class="btn btn-sm btn-outline-secondary px-3" data-notif-filter="unread">Unread Only</button>
      </div>

      <!-- Notifications List -->
      <div id="notifications-list">
        <!-- Rendered dynamically by notifications.js -->
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <ul class="mobile-nav-items">
      <li><a href="index.html" class="mobile-nav-link"><i class="bi bi-house-door-fill"></i><span>Home</span></a></li>
      <li><a href="explore.html" class="mobile-nav-link"><i class="bi bi-compass-fill"></i><span>Explore</span></a></li>
      <li><a href="donate.html" class="mobile-nav-donate-pill" title="Donate"><i class="bi bi-plus-lg"></i></a></li>

      <li><a href="profile.html" class="mobile-nav-link"><i class="bi bi-person-fill"></i><span>Profile</span></a></li>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/notifications.js"></script>
